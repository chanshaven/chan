<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Một câu hỏi nhỏ ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND -->

    <div class="background">

        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <div class="cloud cloud-1">☁</div>
        <div class="cloud cloud-2">☁</div>
        <div class="cloud cloud-3">☁</div>

    </div>


    <!-- FLOATING HEARTS / STARS -->

    <div id="floatingLayer" class="floating-layer"></div>


    <!-- CARD -->

    <main class="card" id="card">

        <div class="ribbon">
            for you ♡
        </div>


        <!-- QUESTION -->

        <section id="questionScreen" class="screen question-screen">

            <div class="bunny">

                <div class="ear ear-left"></div>
                <div class="ear ear-right"></div>

                <div class="bunny-face">

                    <div class="eye eye-left"></div>
                    <div class="eye eye-right"></div>

                    <div class="blush blush-left"></div>
                    <div class="blush blush-right"></div>

                    <div class="mouth">
                        ᴗ
                    </div>

                </div>

            </div>


            <p class="tiny-title">
                ✦ có một câu hỏi bé xíu ✦
            </p>


            <h1>
                Anh có thấy
                <span>em xinh không?</span>
            </h1>


            <p class="subtitle">
                suy nghĩ thật kỹ nhaaaa
                <span class="mini-heart">♡</span>
            </p>


            <div class="button-zone" id="buttonZone">

                <button class="yes-btn" id="yesBtn" type="button">
                    Cóooo ♡
                </button>


                <button class="no-btn" id="noBtn" type="button" aria-label="Không">
                    Không
                </button>

            </div>


            <p class="hint">
                chọn đúng sẽ có quà đó ✨
            </p>

        </section>


        <!-- RESULT -->

        <section id="resultScreen" class="screen result-screen hidden">

            <div class="success-icon">
                ♡
            </div>


            <p class="tiny-title">
                em biết màaa ♡
            </p>


            <h1 class="result-title">

                Đấy, biết ngay

                <span>
                    anh có mắt nhìn mà
                </span>

                ✨

            </h1>


            <!--
            Nếu muốn dùng ảnh:

            <div class="photo-wrapper">

                <img
                    src="images/photo.jpg"
                    alt="cute photo"
                    class="result-photo"
                >

                <div class="photo-tape">
                    ♡
                </div>

            </div>
            -->


            <div class="message-box">

                <span class="quote">
                    “
                </span>

                <p>
                    Cảm ơn vì đã lựa chọn
                    đáp án duy nhất được phép
                    lựa chọn nha =))
                </p>

                <span class="quote quote-end">
                    ”
                </span>

            </div>


            <p class="ending">

                em mãi ủng hộ anh ạ

                <span>
                    ૮ ˶ᵔ ᵕ ᵔ˶ ა
                </span>

            </p>


            <button class="again-btn" id="againBtn" type="button">
                chơi lại ♡
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
